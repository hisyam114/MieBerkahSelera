<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mie Ayam Financial</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen flex items-center justify-center p-4">
  
  <div class="w-full max-w-md">
    <!-- Logo/Header -->
    <div class="text-center mb-8">
      <div class="bg-green-600 text-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-gray-800">Mie Ayam</h1>
      <p class="text-gray-600 mt-2">Pencatatan Keuangan Harian</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Masuk</h2>
      
      <!-- Login Form -->
      <form id="loginForm" class="space-y-5">
        
        <!-- Username Field -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
            Username
          </label>
          <input 
            type="text" 
            id="username" 
            name="username"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
            placeholder="Masukkan username"
          >
        </div>

        <!-- PIN Field -->
        <div>
          <label for="pin" class="block text-sm font-medium text-gray-700 mb-2">
            PIN (6 digit)
          </label>
          <input 
            type="password" 
            id="pin" 
            name="pin"
            required
            maxlength="6"
            pattern="[0-9]{6}"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
            placeholder="••••••"
          >
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
          <span id="errorText"></span>
        </div>

        <!-- Login Button -->
        <button 
          type="submit" 
          id="loginButton"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
        >
          Masuk
        </button>
      </form>

      <!-- Default Credentials Info -->
      <div class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg text-sm text-gray-700">
        <p class="font-semibold text-blue-800 mb-2">Default Login:</p>
        <p><strong>Admin:</strong> admin / 123456</p>
        <p><strong>Staff:</strong> kasir1 / 111111</p>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-gray-600 text-sm mt-6">
      © 2026 Mie Ayam Financial Recording System
    </p>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 flex items-center space-x-3">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-600"></div>
      <span class="text-gray-700 font-medium">Memproses...</span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    // Check if already logged in
    if (Auth.isAuthenticated()) {
      Auth.redirectByRole();
    }

    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const errorMessage = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      const loadingOverlay = document.getElementById('loadingOverlay');
      const loginButton = document.getElementById('loginButton');
      
      // Hide previous errors
      errorMessage.classList.add('hidden');
      
      // Validate PIN format
      if (!/^\d{6}$/.test(pin)) {
        errorText.textContent = 'PIN harus 6 digit angka';
        errorMessage.classList.remove('hidden');
        return;
      }
      
      // Show loading
      loadingOverlay.classList.remove('hidden');
      loginButton.disabled = true;
      
      try {
        await Auth.login(username, pin);
        
        // Success - redirect based on role
        Auth.redirectByRole();
        
      } catch (error) {
        // Show error
        errorText.textContent = error.message || 'Login gagal. Periksa username dan PIN Anda.';
        errorMessage.classList.remove('hidden');
        
      } finally {
        // Hide loading
        loadingOverlay.classList.add('hidden');
        loginButton.disabled = false;
      }
    });

    // Auto-focus username field
    document.getElementById('username').focus();
  </script>
</body>
</html>
